<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
        const pointTable = {
            "Node.js(Javascript)": 2,
            "Python(Django)": 2,
            "Java(Spring Boot)": 3,
            "PHP(Laravel)": 3,
            "Ruby(Rails)": 3
        };
    </script>
</head>
<body  class="bg-[#0f172a] text-[#e2e8f0] min-h-screen p-4 antialiased selection:bg-emerald-500 selection:text-slate-900">
    <section class="border border-dotted border-red-400 p-2 pb-6 rounded-2xl border-3">
     <h2 class="text-extrabold text-3xl flex flex-col items-center justify-center border-b border-white rounded-2xl pb-5">Node.js(Javacript)</h2>
     <textarea id="Node" class="w-full h-170 bg-indigo-300 rounded-lg " ></textarea>
    </section>
    <section class="border border-dotted border-red-400 p-2 pb-6 rounded-2xl border-3 mt-2">
             <h2 class="text-extrabold text-3xl flex flex-col items-center justify-center border-b border-white rounded-2xl pb-5">Python(Django)</h2>
     <textarea id="Python" class="w-full h-170 bg-indigo-300 rounded-lg " ></textarea>
    </section>
    <section class="border border-dotted border-red-400 p-2 pb-6 rounded-2xl border-3">
                   <h2 class="text-extrabold text-3xl flex flex-col items-center justify-center border-b border-white rounded-2xl pb-5">Java(Spring Boot)</h2>
     <textarea id="Java" class="w-full h-170 bg-indigo-300 rounded-lg " ></textarea>
    </section>
    <section class="border border-dotted border-red-400 p-2 pb-6 rounded-2xl border-3">
                   <h2 class="text-extrabold text-3xl flex flex-col items-center justify-center border-b border-white rounded-2xl pb-5">PHP(Laravel)</h2>
     <textarea id="PHP" class="w-full h-170 bg-indigo-300 rounded-lg " ></textarea>
    </section>
    <section class="border border-dotted border-red-400 p-2 pb-6 rounded-2xl border-3">
                          <h2 class="text-extrabold text-3xl flex flex-col items-center justify-center border-b border-white rounded-2xl pb-5">Ruby(Rails)</h2>
     <textarea id="ruby" class="w-full h-170 bg-indigo-300 rounded-lg " placeholder="paste your code here" ></textarea>        
    </section>
    <section class="border border-dotted border-red-400 p-2 pb-6 rounded-2xl border-3">
            <h2 class="text-extrabold text-3xl flex flex-col items-center justify-center border-b border-white rounded-2xl pb-5">Framework</h2>
     <textarea id="Framework" class="w-full h-170 bg-indigo-300 rounded-lg " ></textarea>
    </section>
         
    </section>

    <section class="mt-8 rounded-3xl border border-emerald-400/30 bg-slate-800/80 p-5 shadow-2xl shadow-emerald-500/10 backdrop-blur-sm">
        <div class="flex flex-col items-center justify-center gap-3 text-center">
            <p class="text-sm uppercase tracking-[0.3em] text-emerald-300">Total</p>
            <input type="text" id="Result" placeholder="Result" class="w-full max-w-xs rounded-xl border border-slate-600 bg-slate-900/70 px-4 py-3 text-center text-lg font-semibold text-white outline-none focus:border-emerald-400" />
        </div>
    </section>

    <section class="mt-4 flex justify-center rounded-3xl border border-emerald-400/30 bg-slate-800/80 p-6 shadow-2xl shadow-emerald-500/10 backdrop-blur-sm">
        <button class="rounded-full bg-emerald-500 px-6 py-2.5 font-semibold text-slate-950 transition duration-200 hover:bg-emerald-400" id="Submit">Submit</button>
    </section>
</body>
</html>
